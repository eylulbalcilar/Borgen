[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[lint]
exclude_lints = ["screaming-snake-case-immutable", "asm-keccak256"]

[fuzz]
runs = 1000

[invariant]
runs = 64
depth = 250
fail_on_revert = true
